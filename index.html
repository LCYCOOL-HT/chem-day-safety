<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14324f">
<title>化工人的一天｜3D 工安教育遊戲</title>
<style>
:root{
  --bg:#0f2236; --panel:#ffffff; --panel2:#f3f6fa; --ink:#1b2733; --ink2:#55657a; --line:#d8e0ea;
  --accent:#0e7bd8; --accent2:#0a5fa8; --warn:#f5b400; --danger:#e5484d; --ok:#2fae5b; --orange:#ff8a00;
  --glass:rgba(12,28,46,.78); --glass2:rgba(12,28,46,.55);
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --font:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;font-size:15px;cursor:pointer}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;transition:filter .6s}
#c3d.desat{filter:saturate(.15) contrast(1.05)}
.hidden{display:none!important}
/* ---------- generic ---------- */
.btn{min-height:44px;min-width:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;letter-spacing:.5px;box-shadow:0 3px 0 var(--accent2);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent2)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#e8eef5;color:var(--ink);box-shadow:0 3px 0 #c5d1de}
.btn.warn{background:var(--orange);box-shadow:0 3px 0 #c56a00}
.btn.red{background:var(--danger);box-shadow:0 3px 0 #a82f33}
.btn.green{background:var(--ok);box-shadow:0 3px 0 #1f7d40}
.btn:disabled{opacity:.45;cursor:default}
.term{all:unset;color:var(--accent);border-bottom:1.5px dashed var(--accent);cursor:pointer;font-weight:600}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dark .term,.term.lt{color:#7cc4ff;border-color:#7cc4ff}
.qterm{all:unset;flex:0 0 auto;width:44px;min-height:44px;border-radius:10px;background:#e6f0fb;color:var(--accent);font-weight:800;text-align:center;line-height:44px;cursor:pointer;font-size:15px}
.qterm:focus-visible{outline:2px solid var(--accent)}
/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1d4a74,#0b1a2b);color:#fff;z-index:100;text-align:center;padding:20px}
#loading h1{font-size:clamp(24px,6vw,40px);margin:18px 0 6px}
#loading .sub{opacity:.8}
#loading .bar{width:min(320px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:22px}
#loading .bar i{display:block;height:100%;width:0;background:var(--warn);transition:width .3s}
#loading .err{margin-top:20px;color:#ffd166;font-weight:700}
.helmetSpin{width:88px;height:88px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.hud-tl{position:absolute;left:calc(10px + var(--sal));top:calc(10px + var(--sat));display:flex;gap:8px;align-items:flex-start}
#btnPause{width:44px;height:44px;border-radius:12px;border:0;background:var(--glass);color:#fff;font-size:18px}
.safety{background:var(--glass);color:#fff;border-radius:12px;padding:6px 10px;min-width:150px}
.safety .lbl{font-size:12px;opacity:.85;display:flex;justify-content:space-between}
.safety .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.safety .bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .4s,background .4s}
.safety b{font-size:14px}
#safetyNum.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5)}}
#clock{background:var(--glass);color:#fff;border-radius:12px;padding:6px 10px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;min-height:44px;display:flex;align-items:center;gap:6px}
.hud-tr{position:absolute;right:calc(10px + var(--sar));top:calc(10px + var(--sat));display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(300px,60vw)}
#minimap{width:120px;height:120px;border-radius:12px;background:var(--glass);border:2px solid rgba(255,255,255,.35);cursor:pointer;touch-action:none}
#minimap.big{position:fixed;width:min(86vw,86vh,520px);height:min(86vw,86vh,520px);left:50%;top:50%;transform:translate(-50%,-50%);z-index:40}
#eventCard{display:none;background:#fff;border-radius:12px;padding:8px 12px;border:3px solid var(--warn);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:14px;width:100%;animation:popin .35s}
#eventCard.show{display:block}
#eventCard h4{margin:0 0 2px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
#eventCard .t{font-variant-numeric:tabular-nums;color:var(--danger);font-weight:800}
#eventCard.l1{border-color:var(--orange)} #eventCard.l2{border-color:var(--danger);animation:redpulse 1s infinite}
@keyframes redpulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.4)}}
@keyframes popin{from{transform:scale(.7);opacity:0}}
#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--sat));background:var(--glass2);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;max-width:min(560px,92vw);text-align:center;pointer-events:none}
#objective:empty{display:none}
@media (max-width:620px){#objective{top:calc(140px + var(--sat))}}
#joyBase{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:none;pointer-events:none;z-index:11;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);left:34px;top:34px}
#joyHint{position:absolute;left:calc(18px + var(--sal));bottom:calc(18px + var(--sab));color:rgba(255,255,255,.7);font-size:13px;background:var(--glass2);padding:6px 10px;border-radius:10px;pointer-events:none}
.hud-br{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:8px}
#btnInteract{width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,.6);background:rgba(80,90,100,.55);color:rgba(255,255,255,.6);font-weight:800;font-size:15px;line-height:1.1;padding:4px;transition:all .15s}
#btnInteract.ready{background:var(--orange);color:#fff;border-color:#fff;box-shadow:0 0 0 6px rgba(255,138,0,.35);animation:breath 1.2s infinite}
@keyframes breath{50%{box-shadow:0 0 0 12px rgba(255,138,0,.15)}}
#hintCount{background:var(--glass);color:#fff;border-radius:10px;padding:4px 8px;font-size:13px}
#interactTip{position:fixed;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:10px;padding:3px 9px;font-weight:800;font-size:14px;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.3);display:none;z-index:9;white-space:nowrap;animation:bob 1s ease-in-out infinite}
#interactTip b{display:inline-block;background:var(--orange);color:#fff;border-radius:6px;padding:0 6px;margin-right:4px}
@keyframes bob{50%{margin-top:-6px}}
#labels{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#labels .lab{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.88);padding:2px 8px;border-radius:8px;font-size:14px;pointer-events:auto;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#labels .lab.zone{background:rgba(14,123,216,.88);color:#fff;font-weight:700}
#labels .lab.zone .term{color:#fff;border-color:#fff}
#edgeFlash{position:fixed;inset:0;pointer-events:none;z-index:20;box-shadow:inset 0 0 0 0 transparent}
#edgeFlash.y{animation:edgeY 1.6s}
#edgeFlash.g{animation:edgeG .4s}
#edgeFlash.r{animation:edgeR .5s}
@keyframes edgeY{0%,50%{box-shadow:inset 0 0 60px 18px rgba(255,200,0,.85)}25%,75%,100%{box-shadow:inset 0 0 0 0 rgba(255,200,0,0)}}
@keyframes edgeG{0%{box-shadow:inset 0 0 60px 16px rgba(47,174,91,.8)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes edgeR{0%{box-shadow:inset 0 0 70px 20px rgba(229,72,77,.85)}100%{box-shadow:inset 0 0 0 0 transparent}}
#tint{position:fixed;inset:0;pointer-events:none;z-index:7;background:rgba(240,210,40,0);transition:background .3s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .8s}
#fade.on{opacity:1;pointer-events:auto}
.float{position:fixed;font-weight:900;font-size:22px;z-index:30;pointer-events:none;animation:floatup 1.2s forwards;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(110px + var(--sab));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--glass);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:popin .3s;text-align:center}
/* ---------- dialog ---------- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:min(680px,94vw);background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;gap:12px;padding:14px;z-index:35;cursor:pointer;border:3px solid var(--orange)}
#dialog.show{display:flex}
#dialog .ava{flex:0 0 64px;height:64px}
#dialog .name{font-weight:800;color:var(--orange);font-size:14px}
#dialog .txt{font-size:16px;line-height:1.6;min-height:52px}
#dialog .more{font-size:12px;color:var(--ink2);text-align:right}
/* ---------- decision panel ---------- */
#decision{position:fixed;left:0;right:0;bottom:0;height:55%;background:var(--panel);z-index:30;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .35s;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#decision.show{transform:none}
@media (orientation:landscape){
  #decision{top:0;bottom:0;left:auto;right:0;width:clamp(290px,40%,560px);height:auto;border-radius:18px 0 0 18px;transform:translateX(105%);padding-right:var(--sar)}
}
.dhead{padding:10px 14px 6px;border-bottom:1px solid var(--line)}
.dhead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h3{margin:0;font-size:16px}
.dhead .lvl{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:#fff4cc;color:#8a6500;white-space:nowrap}
.dhead .lvl.l1{background:#ffe2c2;color:#a04f00}.dhead .lvl.l2{background:#ffd5d6;color:#a3191d}
.tbar{height:6px;border-radius:3px;background:#e7edf3;margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--accent)}
.tbar.hot i{background:var(--danger)}
.dbody{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.dbody .prompt{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:10px}
.dbody .ctx{font-size:14px;color:var(--ink2);margin-bottom:8px;line-height:1.5}
.opt{display:flex;gap:6px;margin-bottom:8px;align-items:stretch}
.opt .ob{flex:1;text-align:left;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;line-height:1.4}
.opt .ob:hover:not(:disabled){border-color:var(--accent)}
.opt .ob.sel{border-color:var(--accent);background:#e3f0fd}
.opt .ob:disabled{opacity:.4;text-decoration:line-through}
.opt .ob.chk::before{content:'☐ ';font-weight:800}
.opt .ob.chk.sel::before{content:'☑ ';color:var(--accent)}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.55;animation:popin .25s}
.fb .ic{font-size:22px;font-weight:900;margin-right:6px}
.fb.correct{background:#e5f7ec;border:2px solid var(--ok)} .fb.correct .ic{color:var(--ok)}
.fb.ok{background:#fff7da;border:2px solid var(--warn)} .fb.ok .ic{color:#c98f00}
.fb.wrong,.fb.danger{background:#fde8e8;border:2px solid var(--danger)} .fb.wrong .ic,.fb.danger .ic{color:var(--danger)}
.fb .senior{display:block;margin-top:4px;color:var(--ink2);font-size:14px}
.dfoot{padding:8px 14px 12px;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--line)}
.dfoot .btn{flex:1}
.compass{position:relative;width:min(250px,64vw);height:min(250px,64vw);margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff 55%,#e8eef5 56%);border:3px solid var(--line)}
.compass button{position:absolute;width:52px;height:44px;margin:-22px 0 0 -26px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px}
.compass button:hover{border-color:var(--accent)}
.compass button:disabled{opacity:.35}
.compass .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px}
.disclaimer{font-size:13px;color:#8a4b00;background:#fff3df;border-radius:8px;padding:6px 10px;margin-bottom:8px}
/* ---------- minigame ---------- */
#mg{position:fixed;inset:0;z-index:40;background:rgba(8,18,30,.86);display:none;flex-direction:column;color:#fff;padding:calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal))}
#mg.show{display:flex}
#mg.world{background:transparent;pointer-events:none;padding-top:calc(64px + var(--sat))}
#mg.world .mghead{max-width:min(520px,94vw);margin:0 auto}
@media (max-width:620px){#mg.world{padding-top:calc(140px + var(--sat))}}
body.mgworld #eventCard,body.evact #objective{display:none!important}
.hud-tl{flex-wrap:wrap;max-width:calc(100vw - 160px)}
@media (max-width:480px){.safety{min-width:120px}#clock{font-size:15px;min-height:36px}}
#mg.world .mgtimer{width:min(520px,94vw);margin:4px auto}
#mg.world .mghead{pointer-events:auto;background:var(--glass)}
#mg.world .mgbody,#mg.world .mgfoot{display:none}
.mghead{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.mghead h3{margin:0;font-size:16px;flex:1}
.mghead .info{font-size:14px;font-weight:700}
.mgtimer{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin:4px 8px 6px}
.mgtimer i{display:block;height:100%;width:100%;background:var(--warn)}
.mgbody{flex:1;position:relative;overflow:hidden;border-radius:14px;min-height:0}
.mgbody canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mgfoot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.mgintro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,18,30,.92);z-index:5;padding:20px;gap:12px;border-radius:14px}
.mgintro h2{margin:0;font-size:22px}
.mgintro .goal{font-size:17px;line-height:1.6;max-width:520px}
.mgintro .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mgintro .ctl div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-size:14px;max-width:260px}
.count{font-size:90px;font-weight:900;color:var(--warn);animation:popin .5s}
.mgmsg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:6px 14px;border-radius:12px;font-size:15px;z-index:4;pointer-events:none;max-width:92%;text-align:center}
.mgmsg:empty{display:none}
.mgdom{position:absolute;inset:0;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.hot{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;border-radius:12px;border:2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:700;padding:4px 6px;line-height:1.2}
.hot:hover{background:rgba(255,255,255,.2)}
.hot.done{border:2px solid var(--ok);background:rgba(47,174,91,.35)}
.hot.trap{border:3px solid var(--danger)}
.ocard{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:48px;border:3px solid transparent;font-size:15px;touch-action:none}
.ocard.sel{border-color:var(--warn)}
.ocard .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ocard .tx{flex:1}
.ocard .mini{flex:0 0 40px;height:40px;border-radius:8px;border:0;background:#e8eef5;font-size:16px}
.trashzone{border:3px dashed #ff9a9a;border-radius:12px;padding:8px;min-height:60px;color:#ffc9c9;font-size:14px;margin-top:6px}
.trashzone .ocard{opacity:.75}
.ocard.dragging{opacity:.6;transform:scale(1.03)}
.permit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.permit{grid-template-columns:1fr}}
.permit .pcol{background:#fff;color:var(--ink);border-radius:12px;padding:10px}
.permit h4{margin:0 0 8px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;background:#f6f9fc;margin-bottom:6px;min-height:46px;padding:6px 10px;font-size:15px;color:var(--ink)}
.pitem.found{border-color:var(--danger);background:#fde8e8}
.pitem.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scn{display:flex;gap:8px;align-items:center;border-radius:10px;background:#f6f9fc;margin-bottom:6px;padding:6px 8px;font-size:14px}
.scn canvas{flex:0 0 54px;width:54px;height:54px;position:static}
.dress{display:flex;gap:12px;height:100%;align-items:stretch}
.dress .locker{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;overflow-y:auto}
.ditem{background:#fff;color:var(--ink);border-radius:12px;padding:8px 6px;text-align:center;font-size:14px;border:3px solid transparent;min-height:92px;touch-action:none}
.ditem.on{border-color:var(--ok);background:#e8f8ee}
.ditem canvas{width:56px;height:56px;position:static;display:block;margin:0 auto 2px}
.dress .doll{flex:0 0 42%;background:radial-gradient(circle at 50% 40%,#2b5378,#152a40);border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center}
.dress .doll canvas{position:static;width:100%;height:100%}
.dress .doll.spin canvas{animation:spin 1.2s ease-in-out}
@media (max-width:560px){.dress{flex-direction:column-reverse}.dress .doll{flex:0 0 38%}}
/* ---------- screens ---------- */
#screen{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;background:linear-gradient(160deg,rgba(13,40,66,.94),rgba(9,22,36,.97));color:#fff;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));-webkit-overflow-scrolling:touch}
#screen.show{display:block}
#screen.clear{background:linear-gradient(180deg,rgba(9,22,36,.35),rgba(9,22,36,.85))}
.wrap{max-width:760px;margin:0 auto}
.title{font-size:clamp(28px,8vw,52px);font-weight:900;margin:8px 0 4px;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.title small{display:block;font-size:clamp(14px,3.6vw,18px);font-weight:600;opacity:.85;letter-spacing:1px}
.card{background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--panel2);border-radius:12px;padding:8px 10px}
.stat .k{font-size:12px;color:var(--ink2)} .stat .v{font-size:18px;font-weight:800}
.xpbar{height:12px;border-radius:6px;background:#e3e9f0;overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--orange));transition:width 1.2s}
.menuBtns{display:grid;gap:10px;margin-top:12px}
.menuBtns .btn{font-size:18px;min-height:54px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 > *{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{min-height:44px;border-radius:10px;border:0;padding:6px 12px;background:rgba(255,255,255,.12);color:#fff}
.tabs button.on{background:var(--warn);color:#222;font-weight:800}

<script>
'use strict';
// =====================================================================
//  化工人的一天｜3D 工安教育遊戲
//  單一 HTML 檔：Three.js r128（CDN）＋ 程式產生的模型、貼圖、音效

// ===== Utils =====
const DEBUG = /[?&]debug=1/.test(location.search);
const $ = (s, r) => (r || document).querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null) ? vars[k] : m);
const wait = ms => new Promise(r => setTimeout(r, ms));
const hhmm = m => { const h = Math.floor(m / 60), mm = Math.floor(m % 60); return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; };
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const isPortrait = () => innerHeight > innerWidth;
const useDrawer = () => IS_TOUCH || innerWidth < 640;
// 八方位：北 = -z（小地圖上方），東 = +x
const DIRS = [
  { n: '北', v: [0, -1] }, { n: '東北', v: [0.7071, -0.7071] }, { n: '東', v: [1, 0] }, { n: '東南', v: [0.7071, 0.7071] },

];

const capGrade = (g, cap) => GRADE_ORDER[g] > GRADE_ORDER[cap] ? cap : g;

// ===== TEXT（介面文案集中） =====
const TEXT = {
  title: '化工人的一天', subtitle: '3D 工安教育遊戲',

  lunchFacts: [
    '「工安」的「安」，最常見的敵人是「習慣」：做了一百次沒事，第一百零一次就可能出事。',

// ===== Save =====
const Save = {
  KEY: 'chemDay_save_v1',
  data: null,
  defaults() {
    return { xp: 0, rank: 0, cards: [], badges: [], days: 0, bestGrade: null, noAccidentStreak: 0, terms: [], nearMiss: 0,

const RANKS = [
  { name: '見習工程師', xp: 0, unlock: '基本事件' },
  { name: '工程師', xp: 300, unlock: '事件變體全開、白色安全帽' },

];
const rankOf = xp => { let r = 0; RANKS.forEach((k, i) => { if (xp >= k.xp) r = i; }); return r; };

// ===== AudioFX（Web Audio 合成） =====
const AudioFX = {
  ctx: null, master: null, amb: null, noiseBuf: null, pinkBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = Save.data.settings.volume; this.master.connect(this.ctx.destination);

    } catch (e) { this.ctx = null; }
  },
  setVolume(v) { if (this.master) this.master.gain.value = v; },
  makeNoise(sec, pink) {
    const n = Math.floor(this.ctx.sampleRate * sec), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;

      if (pink) { b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048; d[i] = (b0 + b1 + b2) * 0.9; } else d[i] = w;

  ok() { return this.ctx && this.ctx.state === 'running'; },
  tone(freq, dur, type, vol, when, slideTo) {

  },
  noise(dur, vol, freq, ftype, when) {
    if (!this.ok()) return;

    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  startAmbient() {
    if (!this.ok() || this.amb) return;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.pinkBuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 320; g.gain.value = 0.1;

  },
  stopAmbient() { if (this.amb) { try { this.amb.s.stop(); } catch (e) { } this.amb = null; } },
  step(run) { this.noise(0.06, run ? 0.07 : 0.05, 900, 'bandpass'); },

  wrong() { this.tone(330, 0.32, 'sawtooth', 0.18, 0, 140); },
  heartbeat() { this.tone(60, 0.12, 'sine', 0.6); this.tone(55, 0.12, 'sine', 0.45, 0.18); },
  levelup() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.25, i * 0.09)); },
  beep(f, v) { this.tone(f || 1200, 0.08, 'square', v || 0.08); },
  success() { [659, 784, 988].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.25, i * 0.08)); },
  pumpSound(kind) {

    o.type = 'sawtooth'; o.frequency.value = 98; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.15); g.gain.setValueAtTime(0.12, t0 + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  }

// ===== Icons（程式繪製小插圖） =====
const Icons = {
  draw(cv, type, opt) {

  },
  remove(n) { World.scene.remove(n.h.group); const i = this.list.indexOf(n); if (i >= 0) this.list.splice(i, 1); },
  clearTemp() { this.list.filter(n => n.temp).forEach(n => this.remove(n)); },
  clearAll() { this.list.slice().forEach(n => this.remove(n)); this.senior = null; },
  sync(n) { n.h.group.position.x = n.pos.x; n.h.group.position.z = n.pos.z; n.h.group.rotation.y = n.yaw; },
  moveTo(n, x, z, dt, speed) {
    const dx = x - n.pos.x, dz = z - n.pos.z, d = Math.hypot(dx, dz);
    if (d < 0.15) return true;
    const s = Math.min(d, speed * dt); n.pos.x += dx / d * s; n.pos.z += dz / d * s;
    let want = Math.atan2(dx, dz), df = want - n.yaw; while (df > Math.PI) df -= Math.PI * 2; while (df < -Math.PI) df += Math.PI * 2; n.yaw += df * Math.min(1, dt * 8);
    return false;
  },
  update(dt, t, frozen) {
    this.list.forEach(n => {
      let sp = 0;
      if (!frozen) {
        if (n.state === 'walk' && n.path) {
          const p = n.path[n.idx];
          if (this.moveTo(n, p[0], p[1], dt, n.speed)) { n.idx += n.dir; if (n.idx >= n.path.length || n.idx < 0) { n.dir *= -1; n.idx += n.dir * 2; n.idx = clamp(n.idx, 0, n.path.length - 1); } }

        } else if (n.state === 'follow' && n.leader) {

        else if (n.state === 'face') { const dx = Player.pos.x - n.pos.x, dz = Player.pos.z - n.pos.z; let want = Math.atan2(dx, dz), df = want - n.yaw; while (df > Math.PI) df -= Math.PI * 2; while (df < -Math.PI) df += Math.PI * 2; n.yaw += df * Math.min(1, dt * 6); }

const Forklift = {
  list: [], route: [[13, -18.5], [-12, -18.5], [-12, -27], [-19, -27]], cooldown: 0,
  init() {
    [0, 2].forEach((startIdx, k) => {
      const m = World.forkliftModel(World.scene, 0, 0, 0, false);
      const f = { m, seg: startIdx, t: k ? 0.3 : 0, dir: 1, pos: V3(), yaw: 0, stopped: false, beepT: 0, reverse: false, wait: 0, col: { x: 0, z: 0, r: 1.25 } };

    });
  },
  reset() { this.cooldown = 0; },
  place(f) {
    const r = this.route, a = r[f.seg], b = r[f.seg + 1];
    f.pos.set(lerp(a[0], b[0], f.t), 0, lerp(a[1], b[1], f.t));
    const fwd = f.dir > 0 ? Math.atan2(b[0] - a[0], b[1] - a[1]) : Math.atan2(a[0] - b[0], a[1] - b[1]);
    // 回程第一段倒車
    f.reverse = f.dir < 0 && f.seg === r.length - 2;
    f.yaw = f.reverse ? fwd + Math.PI : fwd;
    f.m.position.set(f.pos.x, 0, f.pos.z); f.m.rotation.y = f.yaw; f.col.x = f.pos.x; f.col.z = f.pos.z;
  },
  update(dt, t, active) {
    if (this.cooldown > 0) this.cooldown -= dt;
    this.list.forEach(f => {
      const r = this.route, a = r[f.seg], b = r[f.seg + 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const mdx = (b[0] - a[0]) / len * f.dir, mdz = (b[1] - a[1]) / len * f.dir;
      const px = Player.pos.x - f.pos.x, pz = Player.pos.z - f.pos.z, pd = Math.hypot(px, pz);
      const ahead = (px * mdx + pz * mdz) / Math.max(0.01, pd);
      f.stopped = pd < 3.2 && ahead > -0.2 || NPCs.list.some(n => Math.hypot(n.pos.x - f.pos.x, n.pos.z - f.pos.z) < 2.2);
      if (pd < 1.5 + 1.25 && active && !onWalkway(Player.pos.x, Player.pos.z) && this.cooldown <= 0) { this.cooldown = 10; Game.nearMiss(); }
      if (f.wait > 0) f.wait -= dt;
      else if (!f.stopped) {
        f.t += f.dir * 2.6 * dt / len;

        else if (f.t < 0) { if (f.seg > 0) { f.seg--; f.t = 1; } else { f.t = 0; f.dir = 1; f.wait = 1.5; } }
      }
      this.place(f);
      const bc = f.m.userData.beacon.material.color;
      if (f.reverse && !f.stopped) { bc.set(Math.sin(t * 14) > 0 ? 0xffaa00 : 0x553300); f.beepT -= dt; if (f.beepT <= 0) { f.beepT = 0.5; if (pd < 22) AudioFX.beep(1500, 0.05 * (1 - pd / 22)); } }
      else bc.set(f.stopped ? 0xff3300 : 0x885500);
    });
  }
};

function makeCanvas(host) {
  const cv = document.createElement('canvas'); host.appendChild(cv);
  const o = { cv, ctx: cv.getContext('2d'), W: 0, H: 0 };
  o.fit = () => { const r = host.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); if (Math.abs(r.width - o.W) > 1 || Math.abs(r.height - o.H) > 1 || !o.W) { o.W = r.width; o.H = r.height; cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d); o.ctx.setTransform(d, 0, 0, d, 0, 0); } };
  o.pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  o.fit(); return o;
}

GAMES.pressure = (api, P) => {
  const c = makeCanvas(api.body);
  let p = 52, v = 0.78, ve = 0.78, green = 0, red = false, t = 0, drag = null, hold = 0, confirm = false;
  const dn = 1 + (P.rank || 0) * 0.15;

  trap.style.outline = '3px solid #ff9a9a';
  [[minus, -1], [plus, 1]].forEach(([b, d]) => { b.onpointerdown = e => { hold = d; e.preventDefault(); }; b.onpointerup = b.onpointerleave = b.onpointercancel = () => { hold = 0; }; });
  trap.onclick = () => {
    confirm = true; Game.block('mgconfirm');
    const box = document.createElement('div'); box.className = 'mgintro';
    box.innerHTML = '<h2>⚠ 確定要關斷安全閥？</h2><div class="goal">' + Glossary.markup('關斷安全閥前的隔離閥，壓力就不會從安全閥洩掉…') + '</div>';
    const row = document.createElement('div'); row.className = 'row2';
    row.appendChild(btn('確定關斷', 'red', () => { box.remove(); Game.unblock('mgconfirm'); api.finish('danger', '你關斷了安全閥前的隔離閥。安全閥是壓力過高時的最後一道防線，平時必須全開。'); }));
    row.appendChild(btn('取消', 'sec', () => { box.remove(); confirm = false; Game.unblock('mgconfirm'); }));
    box.appendChild(row); api.body.appendChild(box);
  };
  api.foot.append(minus, plus, trap);
  c.cv.onpointerdown = e => { drag = c.pt(e).x; c.cv.setPointerCapture(e.pointerId); };
  c.cv.onpointermove = e => { if (drag != null) { const x = c.pt(e).x; v = clamp(v + (x - drag) / 260, 0, 1); drag = x; } };
  c.cv.onpointerup = c.cv.onpointercancel = () => { drag = null; };
  return {

// ---------- 帶大家撤離（3D 場景中進行） ----------
GAMES.evacuate = (api, P) => {
  const ev = P.ev, L = ev.loc.fx, from = DIRS[Game.day.windFrom].v, down = [-from[0], -from[1]], cross = [-down[1], down[0]];
  const dn = 1 + (P.rank || 0) * 0.15;
  const gas = (ev.fx && ev.fx.gas) || FX.gas(L[0], L[2], down);
  // 上風處的臨時集合點
  let T = null;
  for (let d = 20; d <= 30 && !T; d += 2) for (let s = 0; s <= 10 && !T; s += 2) for (const sg of [1, -1]) { const tx = L[0] + from[0] * d + cross[0] * s * sg, tz = L[2] + from[1] * d + cross[1] * s * sg; if (World.pointFree(tx, tz, 2)) { T = [tx, tz]; break; } }
  if (!T) T = [clamp(L[0] + from[0] * 18, -36, 36), clamp(L[2] + from[1] * 18, -36, 36)];
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.6, 3.2, 32), new THREE.MeshBasicMaterial({ color: 0x2fff8a, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(T[0], 0.06, T[1]); World.scene.add(ring);
  Game.tempTarget = { x: T[0], z: T[1] };
  const spots = [[cross[0] * 7 + down[0] * 3, cross[1] * 7 + down[1] * 3], [-cross[0] * 7 + down[0] * 4, -cross[1] * 7 + down[1] * 4], [down[0] * 3 + cross[0] * 2.5 - from[0] * 2, down[1] * 3 + cross[1] * 2.5 - from[1] * 2]];
  const workers = spots.map(s => {
    let x = L[0] + s[0], z = L[2] + s[1]; for (let k = 0; k < 10 && !World.pointFree(x, z, 0.6); k++) { x += from[0] * 1.2; z += from[1] * 1.2; }
    const n = NPCs.spawn({ x, z, temp: true, name: '作業員' }); n.state = 'face'; n.evac = true; return n;
  });
  let followers = [], delivered = 0, gasT = 0, t = 0, beepT = 0, ended = false;
  const inters = workers.map(n => Game.addInteract({ get x() { return n.pos.x; }, get z() { return n.pos.z; }, r: 2.2, label: '帶他走', icon: '!', test: () => n.state === 'face', fn: () => {
    n.state = 'follow'; n.leader = followers.length ? followers[followers.length - 1].pos : Player.pos; n.gap = 1.5; followers.push(n); AudioFX.click(); api.msg('「好，我跟你走！」（' + followers.length + ' 人跟隨中）');
  } }));
  return {
    world: true,
    update(dt, tt) {
      t += dt; gas.setExtent(3 + t * 1.15 * dn, Math.min(5, 1.8 + t * 0.09 * dn));
      const inGas = gas.contains(Player.pos.x, Player.pos.z);
      if (inGas) { gasT += dt; beepT -= dt; if (beepT <= 0) { beepT = 0.18; AudioFX.beep(1800, 0.1); } api.msg('⚠ 你在氣霧裡！快離開（' + gasT.toFixed(1) + ' 秒）'); }
      $('#tint').style.background = inGas ? 'rgba(240,210,40,.35)' : 'rgba(240,210,40,0)';
      ring.material.opacity = 0.6 + Math.sin(tt * 5) * 0.25;
      workers.forEach(n => { if (n.state === 'follow' && Math.hypot(n.pos.x - T[0], n.pos.z - T[1]) < 3.6) { n.state = 'goto'; n.target = [T[0] + rand(-1.5, 1.5), T[1] + rand(-1.5, 1.5)]; n.speed = 2; delivered++; AudioFX.correct(); followers = followers.filter(f => f !== n); followers.forEach((f, i) => f.leader = i ? followers[i - 1].pos : Player.pos); api.msg('✔ 已安全帶到 ' + delivered + ' 人'); } });
      api.setInfo('已帶到 ' + delivered + ' / 3　氣霧中 ' + gasT.toFixed(1) + ' 秒');
      if (!ended && gasT > 3) { ended = true; api.finish('wrong', '你在氣霧中停留超過 3 秒！撤離時要繞開氣霧，不走捷徑。'); }
      else if (!ended && delivered >= 3) { ended = true; api.finish(gasT > 0 ? 'ok' : 'correct', gasT > 0 ? '3 人都帶到了，但你曾經走進氣霧（' + gasT.toFixed(1) + ' 秒）。' : '3 人全部帶到上風處，也沒有走進氣霧！'); }
    },
    timeout() { return delivered >= 2 && gasT <= 3 ? ['ok', '時間到，帶到了 ' + delivered + ' 人。'] : ['wrong', '時間到，只帶到 ' + delivered + ' 人。']; },
    destroy() { World.scene.remove(ring); ring.material.dispose(); ring.geometry.dispose(); inters.forEach(i => Game.removeInteract(i)); $('#tint').style.background = 'rgba(240,210,40,0)'; Game.tempTarget = null; workers.forEach(n => { if (n.state === 'follow' || n.state === 'face') { n.state = 'goto'; n.target = [T[0] + rand(-1.5, 1.5), T[1] + rand(-1.5, 1.5)]; n.speed = 3; } }); }
  };

  },
  // ---------- 主迴圈 ----------
  frames: 0, fpsT: 0, fps: 60, lowCount: 0, mapT: 0,
  update(dt) {
    this.t += dt; const t = this.t;
    let inp = Input.read();
    this.fpsT += dt; this.frames++;
    if (this.fpsT >= 1) {
      this.fps = this.frames / this.fpsT; this.frames = 0; this.fpsT = 0;
      if (this.state === 'play' && !this.autoLow && Save.data.settings.quality === 'auto') { this.lowCount = this.fps < 25 ? this.lowCount + 1 : 0; if (this.lowCount >= 3) { this.autoLow = true; World.applyQuality(true); UI.toast('畫面不夠順，已自動降低畫質（可在設定調整）'); } }
      if (DEBUG) { const d = $('#debug'); if (d) d.textContent = 'FPS ' + this.fps.toFixed(0) + '  calls ' + World.renderer.info.render.calls + '  tris ' + World.renderer.info.render.triangles + '\n' + hhmm(Clock.min) + '  1-9 觸發事件  F +30分  T 跳到下班  G 跳過換裝'; }
    }
    if (this.state !== 'play') { CameraRig.update(dt, inp); World.update(dt, t); FX.update(dt, t); return; }
    const frozen = this.blocked(), sdt = frozen ? 0 : dt * this.timeScale;
    if (frozen && !this.blocks.has('accident-anim')) inp = { moveX: 0, moveZ: 0, run: false, interact: false, lookX: 0, lookY: 0, zoom: 0 };
    const accAnim = this.blocks.has('accident-anim'), adt = accAnim ? dt * this.timeScale : sdt;
    Player.update(adt, inp, t);
    const npcFrozen = !accAnim && EventManager.handling && !(MiniGames.active && MiniGames.active.world);
    NPCs.update(adt, t, npcFrozen || (frozen && !accAnim));
    Forklift.update(adt, t, this.day.phase === 'work' && !EventManager.handling);
    if (!frozen) { Clock.update(sdt); EventManager.update(sdt); MiniGames.update(sdt, t); }
    FX.update(adt, t); World.update(dt, t);
    CameraRig.update(dt, inp);
    if (this.day.phase === 'dress') this.gateCheck();
    this.updateInteract(inp);
    this.updateArrow(t);
    World.updateLabels();
    UI.clock();
    this.mapT += dt; if (this.mapT > (UI.mapBig ? 0.05 : 0.12)) { this.mapT = 0; UI.minimap(t); if (EventManager.pending) UI.eventCard(); }
  },
  updateInteract(inp) {
    const tip = $('#interactTip'), bi = $('#btnInteract');
    let best = null;
    if (this.canMove()) {
      const fx = Math.sin(Player.yaw), fz = Math.cos(Player.yaw);
      this.interacts.forEach(o => {
        if (o.test && !o.test()) return;
        const dx = o.x - Player.pos.x, dz = o.z - Player.pos.z, d = Math.hypot(dx, dz); if (d > o.r) return;
        const front = d < 0.01 || (dx * fx + dz * fz) / d > 0.707;
        const score = d - (front ? 10 : 0);
        if (!best || score < best.score) best = { o, score };
      });
    }
    if (best) {
      const o = best.o, v = V3(o.x, 2.3, o.z).project(World.camera);
      tip.style.display = 'block'; tip.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; tip.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
      tip.innerHTML = (IS_TOUCH ? '' : '<b>E</b>') + (o.icon === '!' ? '❗ ' : '') + esc(o.label);
      bi.classList.add('ready'); bi.textContent = o.label;
      if (inp.interact) { AudioFX.click(); o.fn(); }
    } else { tip.style.display = 'none'; bi.classList.remove('ready'); bi.textContent = '互動'; }
  },
  arrow: null,
  updateArrow(t) {
    if (!this.arrow) {
      const s = new THREE.Shape(); s.moveTo(0, 1.4); s.lineTo(0.7, 0.4); s.lineTo(0.25, 0.4); s.lineTo(0.25, -0.6); s.lineTo(-0.25, -0.6); s.lineTo(-0.25, 0.4); s.lineTo(-0.7, 0.4); s.closePath();
      this.arrow = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide }));
      this.arrow.rotation.order = 'YXZ'; World.scene.add(this.arrow);
    }
    const ev = EventManager.pending, tgt = Game.tempTarget ? [Game.tempTarget.x, Game.tempTarget.z] : (ev && ev.state === 'pending' && !ev.def.silent ? ev.loc.p : null);
    const show = tgt && Math.hypot(tgt[0] - Player.pos.x, tgt[1] - Player.pos.z) > 3.5;
    this.arrow.visible = !!show;
    if (show) { const a = Math.atan2(tgt[0] - Player.pos.x, tgt[1] - Player.pos.z); this.arrow.position.set(Player.pos.x + Math.sin(a) * 1.6, 0.07, Player.pos.z + Math.cos(a) * 1.6); this.arrow.rotation.set(-Math.PI / 2, a, 0); this.arrow.rotation.y = a; this.arrow.material.color.set(Game.tempTarget ? 0x3cff8a : 0xffcc00); this.arrow.material.opacity = 0.6 + Math.sin(t * 6) * 0.25; }
  }
};

// ===== 啟動 =====
(function boot() {
  const bar = $('#loadBar'), msg = $('#loadMsg');
  const fail = () => { msg.innerHTML = '<div class="err">' + TEXT.loadFail + '</div>'; bar.style.width = '100%'; bar.style.background = '#e5484d'; };
  if (window.__threeFail || typeof THREE === 'undefined') { fail(); return; }
  bar.style.width = '40%';
  setTimeout(() => {
    try {
      Game.init(); bar.style.width = '100%';
      let last = performance.now();
      const loop = now => { requestAnimationFrame(loop); const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; Game.update(dt); World.renderer.render(World.scene, World.camera); };
      requestAnimationFrame(loop);
      setTimeout(() => { $('#loading').style.transition = 'opacity .5s'; $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 520); }, 250);
    } catch (e) { console.error(e); msg.innerHTML = '<div class="err">載入失敗：' + esc(e.message) + '</div>'; }
  }, 30);
  window.__game = { Game, EventManager, Clock, Player, Save, World, MiniGames, UI, Decision, EVENTS, NPCs, Forklift };
})();
</script>
